
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: haitipay_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: haitipay_wallet
      MYSQL_USER: haitipay
      MYSQL_PASSWORD: haitipay123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/database/migrations:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: