services:
  - type: web
    name: haitipay-wallet-api
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: BUN_VERSION
        value: ""

# Note: Render ne supporte pas MySQL nativement dans le plan gratuit
# Vous devrez utiliser une base MySQL externe (PlanetScale, AWS RDS, etc.)
# ou adapter le code pour PostgreSQL
# databases:
#   - name: haitipay-wallet-db
#     plan: free
#     databaseName: haitipay_wallet
#     user: haitipay_user
